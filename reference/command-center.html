<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maqo Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F3;--surface:#FFFFFF;--surface2:#F6F8F6;--line:#E0E5E1;--line2:#ECEFED;--text:#17201A;--muted:#56605A;--soft:#3B453F;
  --brand:#0B5D33;--brand-ink:#FFFFFF;--brand-tint:#E5EFE9;--hover:#EFF2F0;--scrim:rgba(23,32,26,.38);
  --g-fg:#14532D;--g-bg:#E1F3E6;--g-dot:#1F9D55;
  --b-fg:#1E3A8A;--b-bg:#E6EDFC;--b-dot:#2F5FD0;
  --a-fg:#6B3E0A;--a-bg:#FBEFCF;--a-dot:#C98A0B;
  --r-fg:#7F1D1D;--r-bg:#FBE4E4;--r-dot:#C93030;
  --n-fg:#374151;--n-bg:#ECEEF0;--n-dot:#9AA1A9;
  --shadow:0 1px 2px rgba(23,32,26,.06);--pop:0 20px 50px rgba(23,32,26,.2);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111513;--surface:#191E1B;--surface2:#1F2521;--line:#2C342F;--line2:#242A26;--text:#E7ECE8;--muted:#9AA59E;--soft:#C3CBC5;
  --brand:#56C489;--brand-ink:#08170E;--brand-tint:#1C3326;--hover:#222924;--scrim:rgba(0,0,0,.55);
  --g-fg:#93DDB2;--g-bg:#173323;--g-dot:#3FBF77;--b-fg:#AFC5FF;--b-bg:#1B2947;--b-dot:#6C93F0;
  --a-fg:#F1CF7C;--a-bg:#382E12;--a-dot:#E0A92B;--r-fg:#F6ABAB;--r-bg:#41201F;--r-dot:#E35D5D;
  --n-fg:#C6CCD2;--n-bg:#2A2F33;--n-dot:#7E868E;--shadow:none;--pop:0 20px 50px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#191E1B;--surface2:#1F2521;--line:#2C342F;--line2:#242A26;--text:#E7ECE8;--muted:#9AA59E;--soft:#C3CBC5;
  --brand:#56C489;--brand-ink:#08170E;--brand-tint:#1C3326;--hover:#222924;--scrim:rgba(0,0,0,.55);
  --g-fg:#93DDB2;--g-bg:#173323;--g-dot:#3FBF77;--b-fg:#AFC5FF;--b-bg:#1B2947;--b-dot:#6C93F0;
  --a-fg:#F1CF7C;--a-bg:#382E12;--a-dot:#E0A92B;--r-fg:#F6ABAB;--r-bg:#41201F;--r-dot:#E35D5D;
  --n-fg:#C6CCD2;--n-bg:#2A2F33;--n-dot:#7E868E;--shadow:none;--pop:0 20px 50px rgba(0,0,0,.5);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 13px/1.45 'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.layout{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.nav{display:flex;align-items:center;gap:12px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--soft);text-align:left;width:100%}
.nav:hover{background:var(--hover)}
.nav[aria-current="page"]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.nav svg{flex-shrink:0}
.nav .badge{margin-left:auto}
.main{padding:22px 28px 56px;display:flex;flex-direction:column;gap:18px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.title{font-size:22px;font-weight:600;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px}
.g2b{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:5px;text-align:left;color:var(--text);box-shadow:var(--shadow)}
.kpi .v{font-size:22px;font-weight:600;line-height:1.1}
.kpi.big{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.kpi.big .v{font-size:32px;font-weight:700}
.kpi.big .muted{color:inherit;opacity:.85}
button.kpi:hover{border-color:var(--muted)}
button.kpi.big:hover{border-color:var(--brand);filter:brightness(1.06)}

.btn{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:500;transition:transform 100ms ease-out,background-color 150ms}
.btn:hover{background:var(--hover)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:600;min-height:42px}
.btn.primary:hover{filter:brightness(1.07);background:var(--brand)}
.btn.outline{border-color:var(--brand);color:var(--brand);font-weight:600}
.btn.danger{color:var(--r-fg);border-color:var(--r-dot)}
.btn.sm{min-height:34px;padding:0 10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center}
.icon-btn:hover{background:var(--hover)}

.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{min-height:34px;padding:0 13px;border:0;border-radius:7px;background:transparent;color:var(--soft);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:34px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sq{border-radius:8px;border:0;background:var(--surface2);color:var(--soft)}
.chip.sq[aria-pressed="true"]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.tag{display:inline-flex;padding:1px 7px;border-radius:6px;white-space:nowrap}
.t-g{background:var(--g-bg);color:var(--g-fg)}.d-g{background:var(--g-dot)}
.t-b{background:var(--b-bg);color:var(--b-fg)}.d-b{background:var(--b-dot)}
.t-a{background:var(--a-bg);color:var(--a-fg)}.d-a{background:var(--a-dot)}
.t-r{background:var(--r-bg);color:var(--r-fg)}.d-r{background:var(--r-dot)}
.t-n{background:var(--n-bg);color:var(--n-fg)}.d-n{background:var(--n-dot)}
.d-k{background:var(--text)}
.c-r{color:var(--r-fg);font-weight:600}.c-a{color:var(--a-fg);font-weight:600}

.av{position:relative;width:34px;height:34px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;flex-shrink:0}
.av.lg{width:48px;height:48px;font-size:15px}
.av .dot{position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border:2px solid var(--surface)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:600;display:block}
.who span{display:block}

.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;min-width:680px}
.tbl th{font-weight:400;color:var(--muted);text-align:left;padding:0 10px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl th button{border:0;background:none;padding:0;color:inherit;font:inherit;display:inline-flex;gap:4px;align-items:center}
.linkish{border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.linkish:hover b,.linkish:hover .ttl{text-decoration:underline}

.bar{position:relative;flex-grow:1;height:6px;border-radius:99px;background:var(--line2);overflow:hidden;min-width:40px}
.bar>i{display:block;height:100%;border-radius:99px}
.bar.thick{height:9px}
.bar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.35}
.barrow{display:flex;align-items:center;gap:8px}

.list-btn{display:flex;align-items:flex-start;gap:10px;border:0;background:transparent;border-radius:9px;padding:9px 8px;text-align:left;width:100%}
.list-btn:hover{background:var(--hover)}
.empty{padding:16px 10px;color:var(--muted)}

.steps{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.steps .seg4{display:inline-flex;gap:3px}
.steps .seg4 i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.segbar{position:relative;display:flex;gap:2px;flex-grow:1;height:10px;border-radius:99px;overflow:hidden;background:var(--line2);min-width:60px}
.segbar>i{display:block;height:100%}
.segbar .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.stagepick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stageopt{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;padding:0 8px;text-align:center}
.stageopt input{position:absolute;opacity:0;pointer-events:none}
.stageopt:has(input:checked){border:2px solid var(--text);background:var(--surface2)}
.stageopt:has(input:focus-visible){outline:2px solid var(--brand);outline-offset:2px}
.stageopt.off{opacity:.45;cursor:not-allowed}
@media (max-width:520px){.stagepick{grid-template-columns:repeat(2,minmax(0,1fr))}}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.tcard .ttl{font-weight:500}

.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.pcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;color:var(--text)}
.pcard:hover{border-color:var(--muted)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line)}
.cal .hd{background:var(--surface2);padding:8px;color:var(--muted);text-align:center}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;border:0;text-align:left;color:var(--text);gap:3px}
.cal .day.out{background:var(--surface2);color:var(--muted)}
.cal .day[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--brand)}
.cal .dnum{font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal .today .dnum{background:var(--brand);color:var(--brand-ink)}
.cal .ev{display:block;font-size:12px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:500}
.inp{min-height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);width:100%}
textarea.inp{padding:10px 12px;min-height:84px;resize:vertical}
select.inp{padding-right:8px}
.inp:focus{border-color:var(--brand)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.check{display:inline-flex;align-items:center;gap:8px;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.help{color:var(--muted)}
.err{color:var(--r-fg)}

.overlay{position:fixed;inset:0;z-index:40;display:flex}
.scrim{position:absolute;inset:0;border:0;background:var(--scrim);cursor:default}
.drawer{position:relative;margin-left:auto;width:460px;max-width:100%;height:100%;overflow-y:auto;background:var(--surface);padding:calc(22px + env(safe-area-inset-top,0px)) 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;box-shadow:var(--pop);animation:slin 280ms cubic-bezier(.16,1,.3,1)}
.modal{position:relative;margin:auto;width:600px;max-width:calc(100% - 24px);max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--pop);animation:pop 220ms cubic-bezier(.16,1,.3,1)}
.modal.sm{width:420px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini>div{background:var(--surface2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--text);color:var(--bg);border-radius:12px;padding:12px 16px;box-shadow:var(--pop);display:flex;align-items:center;gap:10px;max-width:calc(100% - 40px);animation:pop 220ms cubic-bezier(.34,1.56,.64,1)}
.banner{border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--surface2),var(--line2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@keyframes slin{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.mtop{display:none}

@media (max-width:1240px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g2,.g2b{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mtop{display:flex;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:4px;overflow-x:auto}
  .mtop .nav{width:auto;white-space:nowrap;min-height:40px}
  .main{padding:16px 14px 48px}
  .kpis,.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.fgrid{grid-template-columns:minmax(0,1fr)}
  .cal .day{min-height:64px}
  .cal .ev{font-size:0;height:6px;padding:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<div id="toast" aria-live="polite"></div>
<script>
'use strict';
/* ---------- utils ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const TODAY=todayStr();
function dn(s){if(!s||typeof s!=='string')return NaN;const p=s.split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}
function ds(n){return new Date(n*864e5).toISOString().slice(0,10);}
const T0=dn(TODAY);
function fd(s){if(!s)return '—';const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1];}
function fdy(s){if(!s)return '—';const p=s.split('-');return (+p[2])+' '+MON[+p[1]-1]+' '+p[0];}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
const people=n=>n+(n===1?' person':' people');
const initials=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const LS={get(k){try{return localStorage.getItem('maqo.cc.'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('maqo.cc.'+k,v)}catch(e){}}};
function weekRange(){const dow=new Date(T0*864e5).getUTCDay();const a=T0-((dow+6)%7);return [a,a+6];}
function monthRange(off){const d=new Date(T0*864e5);const y=d.getUTCFullYear(),m=d.getUTCMonth()+(off||0);return [Math.round(Date.UTC(y,m,1)/864e5),Math.round(Date.UTC(y,m+1,0)/864e5)];}
function quarterRange(){const d=new Date(T0*864e5);const y=d.getUTCFullYear(),q=Math.floor(d.getUTCMonth()/3)*3;return [Math.round(Date.UTC(y,q,1)/864e5),Math.round(Date.UTC(y,q+3,0)/864e5)];}

const IC={
 dash:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 people:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.6 3.1 2.4 3.5 5.2"/>',
 tasks:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="m8 12 3 3 5-6"/>',
 dept:'<path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M9 21v-5h6v5M9 10h.01M15 10h.01M12 10h.01"/>',
 proj:'<path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 rep:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
 set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
 left:'<path d="m15 6-6 6 6 6"/>', right:'<path d="m9 6 6 6-6 6"/>', check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',

const DEPT_ORDER=['CEO Office','Residential','Commercial & Industrial','Marketing','Operations & Maintenance','Engineering','Finance','Human Resources','Procurement, Warehouse & Logistics'];
function deptSort(a,b){const ia=DEPT_ORDER.indexOf(a),ib=DEPT_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);}
function allDepts(){return Array.from(new Set(S.emps.map(e=>e.dept).filter(Boolean))).sort(deptSort);}
function statusKey(n,leave){const c=S.settings||{};const cap=+c.capacity||5,al=+c.almost||4;if(leave)return 'leave';if(n===0)return 'free';if(n>=cap)return 'overloaded';if(n>=al)return 'almost';return 'working';}
function ctx(){
 const role=S.role;let me=S.emps.find(e=>e.id===S.actor)||null;
 if(role==='leader'&&!(me&&(me.leads||[]).length))me=S.emps.find(e=>(e.leads||[]).length)||null;
 if(role==='employee'&&!me)me=S.emps[0]||null;
 const depts=role==='ceo'?allDepts():role==='leader'?(me?me.leads||[]:[]):(me?[me.dept]:[]);

}
function build(){
 const c=ctx();
 const empById={};S.emps.forEach(e=>empById[e.id]=e);
 const projById={};S.projs.forEach(p=>projById[p.id]=p);
 const tasks=S.tasks.map(t=>{
  const dd=dn(t.due)-T0, done=t.status==='done', overdue=!done&&dd<0;
  let dueLabel=fd(t.due),dueCls='';
  if(isNaN(dd)){dueLabel='No date';}
  else if(overdue){dueLabel=plural(-dd,'day')+' late';dueCls='c-r';}
  else if(!done&&dd===0){dueLabel='Today';dueCls='c-a';}
  else if(!done&&dd===1){dueLabel='Tomorrow';dueCls='c-a';}
  const e=empById[t.emp];
  return Object.assign({},t,{dd:isNaN(dd)?9999:dd,dueN:dn(t.due),done,overdue,dueLabel,dueCls,
   empName:e?e.name:'Unassigned',dept:e?e.dept:'',projName:projById[t.proj]?projById[t.proj].name:'No project',
   progress:done?100:(+t.progress||0),blocked:!!t.blockedBy&&!done});
 });
 const emps=S.emps.map(e=>{
  const mine=tasks.filter(t=>t.emp===e.id),open=mine.filter(t=>!t.done);
  const key=statusKey(open.length,!!e.onLeave);
  const cap=+(S.settings.capacity)||5;
  const ord={inprogress:0,review:1,todo:2};
  const cur=open.slice().sort((a,b)=>(ord[a.status]-ord[b.status])||(a.dd-b.dd))[0];
  const next=open.slice().sort((a,b)=>a.dd-b.dd)[0];
  return Object.assign({},e,{mine,open,n:open.length,key,st:STATUS[key],cap,loadPct:Math.round(open.length/cap*100),cur,next,
   overdueN:open.filter(t=>t.overdue).length});
 });
 const empX={};emps.forEach(e=>empX[e.id]=e);
 const inScopeEmp=e=>c.role==='ceo'||c.depts.includes(e.dept);
 const sEmps=emps.filter(inScopeEmp);
 const visTask=t=>{if(c.role==='ceo')return true;const e=empX[t.emp];if(c.role==='employee'&&c.me&&t.emp===c.me.id)return true;return !!e&&c.depts.includes(e.dept);};
 const sTasks=tasks.filter(visTask);
 const projects=S.projs.map(p=>{
  const pt=tasks.filter(t=>t.proj===p.id);const doneN=pt.filter(t=>t.done).length;
  const W={todo:0,inprogress:.5,review:.8,done:1};
  const progress=pt.length?Math.round(pt.reduce((a,t)=>a+(W[t.status]||0),0)/pt.length*100):0;
  const nsN=pt.filter(t=>t.status==='todo').length,revN=pt.filter(t=>t.status==='review').length,ogN=pt.filter(t=>t.status==='inprogress').length+revN;
  const a=dn(p.start),b=dn(p.deadline);
  const expected=(isNaN(a)||isNaN(b))?0:Math.max(0,Math.min(100,Math.round((T0-a)/Math.max(1,b-a)*100)));
  let key='ontrack';
  if(pt.length&&doneN===pt.length)key='completed';
  else if(!isNaN(b)&&T0>b)key='delayed';
  else if(expected-progress>25)key='delayed';
  else if(expected-progress>10)key='atrisk';
  const left=b-T0;
  const daysLabel=key==='completed'?'Closed':isNaN(left)?'No deadline':left<0?plural(-left,'day')+' past deadline':left===0?'Due today':plural(left,'day')+' left';
  const owner=empById[p.owner];
  return Object.assign({},p,{pt,doneN,nsN,ogN,revN,remainN:pt.length-doneN,progress,expected,key,st:PSTAT[key],daysLabel,ownerName:owner?owner.name:'No owner',ownerDept:owner?owner.dept:''});
 });
 const sProjects=c.role==='ceo'?projects:projects.filter(p=>p.pt.some(visTask)||c.depts.includes(p.ownerDept));
 return {c,tasks,emps,empX,empById,projById,sEmps,sTasks,projects,sProjects,visTask};
}

  if(u.tDept!=='All'&&t.dept!==u.tDept)return false;
  if(u.tProj!=='all'&&t.proj!==u.tProj)return false;
  if(u.tEmp!=='all'&&t.emp!==u.tEmp)return false;

function periodBounds(){const p=S.ui.rPeriod;if(p==='week')return weekRange();if(p==='30')return [T0-29,T0];if(p==='quarter')return quarterRange();if(p==='last')return monthRange(-1);return monthRange(0);}
function reportData(M){
 const [a,b]=periodBounds();
 const inP=t=>{const c=dn(t.completedAt);return t.done&&!isNaN(c)&&c>=a&&c<=b;};
 const per=list=>{const done=list.filter(inP);const onTime=done.filter(t=>dn(t.completedAt)<=t.dueN).length;
  return {done:done.length,onTime,rate:done.length?Math.round(onTime/done.length*100):null,open:list.filter(t=>!t.done).length,overdue:list.filter(t=>t.overdue).length,dueIn:list.filter(t=>t.dueN>=a&&t.dueN<=b).length};};
 const depts=(M.c.role==='ceo'?allDepts():M.c.depts).map(d=>{const people=M.sEmps.filter(e=>e.dept===d);const list=M.sTasks.filter(t=>t.dept===d);return Object.assign({name:d,people:people.length,free:people.filter(e=>e.key==='free').length},per(list));});

 return {a,b,all:per(M.sTasks),depts,people};
}

/* ---------- writes ---------- */
async function write(fn,okMsg){
 if(!S.db){toast('Shared data is not connected, so this was not saved');return false;}
 if(!S.canWrite){toast('You have view-only access');return false;}
 try{await fn(S.db);if(okMsg)toast(okMsg);return true;}
 catch(e){const code=e&&e.code;
  if(code==='invalid_argument'&&!(e.message||'').match(/path|body|field/i)){S.canWrite=false;toast('You have view-only access, so changes can’t be saved');render();}
  else if(code==='unavailable'){toast('Connection dropped. Try again in a moment.');}
  else if(code==='quota_exceeded'){toast('Storage is full: '+(e.message||'remove old tasks to continue'));}
  else if(code==='revoked'){S.canWrite=false;toast('Your access changed. Reload to continue.');render();}
  else toast('Couldn’t save: '+((e&&e.message)||'unknown error'));
  return false;}
}
function nextDue(due,rep){const d=dn(due);if(isNaN(d))return ds(T0+7);if(rep==='weekly')return ds(d+7);const x=new Date(d*864e5);return ds(Math.round(Date.UTC(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())/864e5));}
async function setStatus(id,status){
 const t=S.tasks.find(x=>x.id===id);if(!t)return;
 const patch={status,updatedAt:new Date().toISOString()};
 if(status==='done')patch.completedAt=TODAY; else patch.completedAt=null;
 const msg=status==='done'?'Marked “'+t.title+'” complete':'Moved “'+t.title+'” to '+STAGE_LABEL[status].toLowerCase();
 const ok=await write(db=>db.doc('tasks/'+id).update(patch),msg);
 if(ok&&status==='done'&&t.status!=='done')await spawnRepeat(t);
}
async function spawnRepeat(t){
 if(!t.repeat||t.repeat==='none')return;
 const n={title:t.title,emp:t.emp,proj:t.proj||'',prio:t.prio||'medium',due:nextDue(t.due,t.repeat),status:'todo',progress:0,blockedBy:'',repeat:t.repeat,notes:t.notes||'',createdAt:new Date().toISOString()};
 await write(db=>db.collection('tasks').add(n),'Next “'+t.title+'” scheduled for '+fd(n.due));
}

function showErr(id,show){const el=document.getElementById(id);if(el)el.hidden=!show;const inp=document.getElementById(id.replace(/-err$/,''));if(inp){inp.setAttribute('aria-invalid',show?'true':'false');inp.style.borderColor=show?'var(--r-dot)':'';}return show;}
async function submitForm(form){
 const kind=form.dataset.form,id=form.dataset.id;const fd_=new FormData(form);
 if(kind==='task'){
  const M=build();const t=id?S.tasks.find(x=>x.id===id):null;
  const data={};
  ['title','emp','proj','due','prio','repeat','blockedBy','notes'].forEach(k=>{const el=form.elements[k];if(el&&!el.disabled)data[k]=String(fd_.get(k)||'').trim();});
  const stv=fd_.get('status');if(stv)data.status=String(stv);
  const title=data.title!=null?data.title:(t&&t.title)||'';const emp=data.emp!=null?data.emp:(t&&t.emp)||'';
  let bad=false;bad=showErr('f-title-err',!title)||bad;bad=showErr('f-emp-err',!emp)||bad;
  if(bad){const f=form.querySelector('[aria-invalid="true"]');if(f)f.focus();return;}
  if(M.c.role==='employee'&&data.status==='done'&&(!t||t.status!=='done'))data.status='review';
  if(data.status==='done'){if(!t||t.status!=='done')data.completedAt=TODAY;}
  else if(data.status)data.completedAt=null;
  data.updatedAt=new Date().toISOString();
  S.saving=true;
  let ok;
  if(t){ok=await write(db=>db.doc('tasks/'+id).update(data),'Saved “'+title+'”');if(ok&&data.status==='done'&&t.status!=='done')await spawnRepeat(Object.assign({},t,data));}
  else{const full=Object.assign({title:'',emp:'',proj:'',prio:'medium',due:ds(T0+7),status:'todo',progress:0,blockedBy:'',repeat:'none',notes:''},data,{createdAt:new Date().toISOString()});
   const e=S.emps.find(x=>x.id===full.emp);ok=await write(db=>db.collection('tasks').add(full),'Assigned “'+title+'” to '+(e?e.name:'them'));}
  S.saving=false;if(ok)closeLayer();
 }
 if(kind==='proj'){
  const data={name:String(fd_.get('name')||'').trim(),owner:String(fd_.get('owner')||''),start:String(fd_.get('start')||''),deadline:String(fd_.get('deadline')||''),desc:String(fd_.get('desc')||'').trim()};
  let bad=false;bad=showErr('p-name-err',!data.name)||bad;bad=showErr('p-owner-err',!data.owner)||bad;bad=showErr('p-dl-err',!!(data.start&&data.deadline&&dn(data.deadline)<dn(data.start)))||bad;
  if(bad)return;
  const ok=id?await write(db=>db.doc('projects/'+id).update(data),'Saved '+data.name):await write(db=>db.collection('projects').add(data),'Created '+data.name);
  if(ok)closeLayer();
 }
 if(kind==='emp'){
  const data={name:String(fd_.get('name')||'').trim(),role:String(fd_.get('role')||'').trim(),dept:String(fd_.get('dept')||'').trim(),leads:fd_.getAll('leads').map(String),onLeave:!!fd_.get('onLeave'),leaveNote:String(fd_.get('leaveNote')||'').trim()};
  let bad=false;bad=showErr('e-name-err',!data.name)||bad;bad=showErr('e-dept-err',!data.dept)||bad;if(bad)return;
  const ok=id?await write(db=>db.doc('employees/'+id).update(data),'Saved '+data.name):await write(db=>db.collection('employees').add(data),'Added '+data.name);
  if(ok)closeLayer();
 }
 if(kind==='settings'){
  const cap=Math.round(+fd_.get('capacity')),al=Math.round(+fd_.get('almost'));
  if(!(cap>=2&&al>=1&&al<cap)){toast('“Almost full” must be lower than “Overloaded”');return;}
  await write(db=>db.doc('settings/app').set({capacity:cap,almost:al}),'Availability rules saved');
 }
}

/* ---------- boot ---------- */
async function boot(){
 render();
 const C=window.claude;
 if(!C||typeof C.use!=='function'){S.dbState='none';render();return;}
 C.use('downloads').then(d=>{S.downloads=d;}).catch(()=>{});
 let user=null;try{user=await C.use('user');}catch(e){}
 if(user){try{const w=await user.can('data.write');if(w===false)S.canWrite=false;}catch(e){}}
 let db=null;try{db=await C.use('db');}catch(e){}
 if(!db){S.dbState='none';render();return;}
 S.db=db;S.dbState='live';render();
 const onErr=name=>e=>{if(e&&e.code==='revoked'){S.canWrite=false;}toast('Live updates stopped for '+name+'. Reload the page.');};
 const sub=(col,key,map)=>db.collection(col).onSnapshot(snap=>{S[key]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));if(map)S[key]=S[key].map(map);S.loaded[col]=true;render();},onErr(col));
 sub('employees','emps',e=>Object.assign({},e,{leads:Array.isArray(e.leads)?e.leads:[]}));
 sub('projects','projs');
 sub('tasks','tasks');
 db.doc('settings/app').onSnapshot(s=>{S.settings=Object.assign({capacity:5,almost:4},s.exists?s.data():{});render();},()=>{});
}
boot();
</script>
</body>
